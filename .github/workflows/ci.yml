name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install strands-agents bedrock-agentcore "boto3>=1.43.37" pytest
      - run: pytest -q
      - run: python -m sim.run_demo   # offline planner, both demo conversations
